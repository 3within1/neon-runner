name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # python3 (used by the smoke test's static server) is preinstalled on
      # the ubuntu-latest runner; surface its version for debugging.
      - name: Show tool versions
        run: |
          node --version
          python3 --version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
